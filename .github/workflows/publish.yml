name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  pypi-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Clean previous builds
        run: rm -rf dist/
      - name: Wait for a207-policy>=0.3.37 on PyPI
        run: |
          for i in $(seq 1 30); do
            if python -c "import urllib.request,json; d=json.load(urllib.request.urlopen('https://pypi.org/pypi/a207-policy/json')); import sys; sys.exit(0 if '0.3.37' in d['releases'] else 1)"; then
              echo "a207-policy 0.3.37 is available on PyPI"; exit 0
            fi
            echo "waiting for a207-policy 0.3.37 to be published (attempt $i/30)..."; sleep 20
          done
          echo "ERROR: a207-policy 0.3.37 not on PyPI after 10 min — publish a207-policy first, then re-run this workflow"; exit 1
      - name: Run tests (X2, 2026-08-14)
        run: |
          python -m pip install --upgrade pip --user
          python -m pip install -e . --user
          export A207_STORAGE_BACKEND=json
          for f in tests/test_*.py; do python "$f" || exit 1; done
      - name: Install build
        run: python -m pip install build --user
      - name: Build package
        run: python -m build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
