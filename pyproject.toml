[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CKDNutri-clinical-data-mcp"
# 十三审（v1.2.22）：在远端 v1.2.21（CI 发布护栏/家长等效可见性）之上叠加报告3 修复。
version = "1.2.27"
description = "P1 临床数据域——患儿档案+化验面板"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2",
    "a207-policy>=0.3.37",
    "tablestore>=6.4",
]

[project.scripts]
CKDNutri-clinical-data-mcp = "CKDNutri_clinical_data_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
CKDNutri_clinical_data_mcp = ["data/*.json"]
