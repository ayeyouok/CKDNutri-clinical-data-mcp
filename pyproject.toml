[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CKDNutri-clinical-data-mcp"
version = "1.2.0"
description = "P1 临床数据域——患儿档案+化验面板"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2",
    "a207-policy>=0.3.17",
    "tablestore>=6.4",
]

[project.scripts]
CKDNutri-clinical-data-mcp = "CKDNutri_clinical_data_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
CKDNutri_clinical_data_mcp = ["data/*.json"]
